<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tidy Feed</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup" id="popup">
      <header class="top">
        <div class="brand">
          <img src="../../icons/icon-48.png" alt="" />
          <span data-i18n="extName">Tidy Feed</span>
        </div>
        <div class="master">
          <span class="master__state" id="masterState" data-i18n="popupOn">Activo</span>
          <label class="switch">
            <input type="checkbox" id="enabled" data-i18n-aria-label="popupToggleLabel" />
            <span class="switch__track"></span>
          </label>
        </div>
      </header>

      <section class="stat" aria-live="polite">
        <div class="stat__number" id="statToday">0</div>
        <div class="stat__caption" data-i18n="statCaption">publicaciones fuera de tu camino hoy</div>
        <ul class="chips">
          <li><span class="dot dot--network"></span><b id="statNetwork">0</b> <span data-i18n="statNetwork">de desconocidos</span></li>
          <li><span class="dot dot--smoke"></span><b id="statSmoke">0</b> <span data-i18n="statSmoke">humo</span></li>
          <li><span class="dot dot--muted"></span><b id="statMuted">0</b> <span data-i18n="statMuted">silenciadas</span></li>
        </ul>
        <div class="stat__total muted" id="statTotal"></div>
      </section>

      <p class="paused-hint" id="pausedHint" data-i18n="popupPausedHint" hidden></p>

      <section class="features" id="features">
        <label class="feature">
          <span class="feature__icon feature__icon--network" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c.6-3.2 2.9-5 5.5-5s4.9 1.8 5.5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="17" cy="9" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16.5 14c2 .2 3.6 1.6 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <span class="feature__text">
            <span class="feature__title" data-i18n="featNetwork">Solo mi red</span>
            <span class="feature__desc" data-i18n="featNetworkDesc"></span>
          </span>
          <span class="switch"><input type="checkbox" data-setting="network.enabled" /><span class="switch__track"></span></span>
        </label>

        <label class="feature">
          <span class="feature__icon feature__icon--smoke" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9.5c2-2 4-2 6 0s4 2 6 0 3-1.6 4-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 15c2-2 4-2 6 0s4 2 6 0 3-1.6 4-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".55"/></svg>
          </span>
          <span class="feature__text">
            <span class="feature__title" data-i18n="featSmoke">Detector de humo</span>
            <span class="feature__desc" data-i18n="featSmokeDesc"></span>
          </span>
          <span class="switch"><input type="checkbox" data-setting="smoke.enabled" /><span class="switch__track"></span></span>
        </label>

        <label class="feature">
          <span class="feature__icon feature__icon--metrics" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 18V11M12 18V6M18 18v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="feature__text">
            <span class="feature__title" data-i18n="featMetrics">Sin números</span>
            <span class="feature__desc" data-i18n="featMetricsDesc"></span>
          </span>
          <span class="switch"><input type="checkbox" data-setting="metrics.enabled" /><span class="switch__track"></span></span>
        </label>
      </section>

      <footer class="bottom">
        <button type="button" class="link" id="openOptions">
          <span data-i18n="popupMore">Más ajustes</span>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="privacy muted">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          <span data-i18n="popupPrivacy">Todo queda en tu navegador</span>
        </span>
      </footer>
    </main>
    <script src="../shared/settings.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
